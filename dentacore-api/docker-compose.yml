services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql # Postgres 18+ path (not .../data)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"] # persist data to the volume
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"       # AMQP
      - "${RABBITMQ_UI_PORT}:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db # persist caught emails to the volume
      MP_MAX_MESSAGES: 500          # auto-prune oldest emails beyond this
      MP_SMTP_AUTH_ACCEPT_ANY: 1    # accept any SMTP credentials the app sends
      MP_SMTP_AUTH_ALLOW_INSECURE: 1 # allow auth without TLS (dev only)
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"   # SMTP
      - "${MAILPIT_UI_PORT}:8025"     # web inbox
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
 
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  mailpit-data: